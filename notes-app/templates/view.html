<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>{{.Subject}}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <a href="/notes">&larr; Back to notes</a>
  <h1>{{.Subject}}</h1>

  {{if .Tags}}
    <p class="tags">
      {{range .Tags}}<span class="tag">{{.}}</span>{{end}}
    </p>
  {{end}}

  <p class="body">{{.Body}}</p>

  <div class="actions">
    <a class="button" href="/notes/{{.ID}}/edit">Edit</a>
    <form method="POST" action="/notes/{{.ID}}/delete"
          onsubmit="return confirm('Delete this note?');" style="display:inline">
      <button type="submit" class="danger">Delete</button>
    </form>
  </div>
</body>
</html>
